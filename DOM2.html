<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title>removeEventListener()</title>
</head>
<body>
	<h2>Disattivazione di un link (preventDefault() e removeEventListener()</h2>
	<p><input type="checkbox" name="privacy" value="ok" id="privacy" checked /> Acconsento al trattamento dei dati personali.<br />
	<a id="myLink" href="https://www.google.it" target="_blank">Vai su Google</a> (questo link non funzionerà se non accetti il trattamento dei dati personali)</p>
	<script>
		const casella = document.getElementById("privacy"); // collego l'elemento DOM allo script
		casella.addEventListener("click", controlla);
		
		function controlla() {
			
			if (casella.checked) {
				document.getElementById("myLink").removeEventListener("click", disabilita); // checkbox selezionata = si rimuove la disattivazione del link
			} else { // checkbox deselezionata
				document.getElementById("myLink").addEventListener("click", disabilita); // checkbox deselezionata = si ripristina la disattivazione del link
			}
			
		}
		
		function disabilita(event) {
			event.preventDefault();
		}
	</script>	
</body>
</html>
